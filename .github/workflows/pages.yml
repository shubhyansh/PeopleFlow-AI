name: Demo (GitHub Pages)

# Publishes the browser demo built by `npm run build:demo`. That build swaps
# the Supabase transport for an in-memory store and ships no API key, so the
# page is safe to expose: there is nothing behind it to reach.
#
# Runs on pushes to main that touch anything the demo renders, and on demand.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# One deployment at a time; a newer push waits rather than racing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build demo bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The demo is only worth publishing if its own suite passes, and the
      # seed-integrity tests are what stop a broken board going live.
      - name: Unit tests
        run: npm run test

      - name: Build demo bundle
        run: npm run build:demo

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-demo

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
